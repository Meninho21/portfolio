<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="[height:100dvh] bg-black bg-cover bg-center bg-no-repeat mt-16"
    style="background-image: url('abstract-digital-technology-background-with-connecting-points-and-lines-symbolizing-fast-digital-network-connection-and-communication-concept-vector.jpg');">

    <nav class="bg-gray-900 text-white fixed top-0 left-0 w-full z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <!-- Logo -->
                <div class="flex-shrink-0">
                    <a href="index.html" class="text-2xl font-bold">Filomeno Antunes</a>
                </div>

                <!-- Menu button (mobile) -->
                <div class="lg:hidden">
                    <button id="menu-button" class="focus:outline-none">
                        <!-- Hamburger icon -->
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>

                <!-- Menu links -->

                <div class="hidden lg:flex space-x-8">
                    <a href="index.html" class="hover:text-gray-300">Home</a>
                    <a href="contact.html" class="hover:text-gray-300">Contact</a>
                </div>

            </div>
        </div>

        <!-- Mobile menu (hidden by default) -->
        <div id="mobile-menu" class="lg:hidden hidden bg-gray-900">
                <a href="index.html" class="block w-full hover:bg-gray-600 rounded text-white text-center p-4">
                    Home
                </a>

                <a href="contact.html" class="block w-full hover:bg-gray-600 rounded text-white text-center pt-4 pb-4">
                    Contact
                </a>
        </div>

        <script>
        // Mobile menu toggle
        const menuButton = document.getElementById('menu-button');
        const mobileMenu = document.getElementById('mobile-menu');

        menuButton.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });
    </script>
    </nav>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
    <div id="game-container"></div>
  <script src="Minigame.js"></script>
</body>
</html>
